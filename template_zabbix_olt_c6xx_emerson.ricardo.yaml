        trigger_prototypes:
        - uuid: 5d3be7e939d74e4599deea4021b9c7ad
          name: 'Fonte {#SNMPINDEX}: temperatura elevada por 5m'
          expression: min(/templete zabbix olt c6xx emerson.ricardo/zte.c610.psu.temperature[{#SNMPINDEX}],5m)>{$PSU.TEMP.WARN}
          priority: WARNING
