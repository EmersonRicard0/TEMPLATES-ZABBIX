          error_handler: DISCARD_VALUE
      - uuid: f829b5edef784649a847f482c961e9db
        name: 'Fonte {#SNMPINDEX}: Temperatura'
        type: SNMP_AGENT
        key: zte.c610.psu.temperature[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: FLOAT
        tags:
        - tag: component
          value: power
        snmp_oid: 1.3.6.1.4.1.3902.3.6002.2.6.2.1.19.{#SNMPINDEX}
        units: C
        preprocessing:
        - type: REGEX
          parameters:
          - ^\s*([-+]?[0-9]+(?:\.[0-9]+)?)
          - \1
