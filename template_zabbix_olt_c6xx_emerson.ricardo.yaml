      snmp_oid: discovery[{#PSU},1.3.6.1.4.1.3902.3.6002.2.6.2.1.10]
      key: zte.c610.psu.discovery
      delay: 6h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_AFTER
      enabled_lifetime: 1d
      item_prototypes:
      - uuid: 12c094a5c08b44c39d2cc58594834d29
        name: 'Fonte {#SNMPINDEX}: Modelo'
        type: SNMP_AGENT
        key: zte.c610.psu.model[{#SNMPINDEX}]
        delay: 6h
        history: 7d
        trends: '0'
        value_type: TEXT
        tags:
        - tag: component
          value: power
        snmp_oid: 1.3.6.1.4.1.3902.3.6002.2.6.2.1.10.{#SNMPINDEX}
      - uuid: df9c4907a1574a72bdca4a92d8e83c4c
        name: 'Fonte {#SNMPINDEX}: Potencia nominal'
        type: SNMP_AGENT
        key: zte.c610.psu.rated[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: FLOAT
        tags:
        - tag: component
          value: power
        snmp_oid: 1.3.6.1.4.1.3902.3.6002.2.6.2.1.16.{#SNMPINDEX}
        units: W
        preprocessing:
        - type: REGEX
          parameters:
          - ^\s*([-+]?[0-9]+(?:\.[0-9]+)?)
          - \1
          error_handler: DISCARD_VALUE
      - uuid: 13730e374aa747be8ec62b389d425337
        name: 'Fonte {#SNMPINDEX}: Potencia consumida'
        type: SNMP_AGENT
        key: zte.c610.psu.power[{#SNMPINDEX}]
