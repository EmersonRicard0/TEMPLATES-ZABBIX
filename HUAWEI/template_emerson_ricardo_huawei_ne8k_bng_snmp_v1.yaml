    - uuid: 0b56f368d06049759f89d11e70326f72
      name: 'BNG: RADIUS server discovery'
      type: DEPENDENT
      key: huawei.ne8k.bng.radius.discovery
      master_item:
        key: huawei.ne8k.bng.radius.walk
      lifetime: 30d
      filter:
        evaltype: AND
        conditions:
        - macro: '{#RADIUSIP}'
          value: '{$BNG.RADIUS.IP.MATCHES}'
        - macro: '{#RADIUSVRF}'
          value: '{$BNG.RADIUS.VRF.MATCHES}'
      description: Descobre servidores RADIUS. O hwRadiusServerStatus (.22) não é exposto na release validada, portanto esta versão não cria status UP/DOWN por polling.
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#RADIUSINDEX}'
        - 1.3.6.1.4.1.2011.5.25.40.15.1.2.1.1
        - '0'
        - '{#RADIUSTYPE}'
        - 1.3.6.1.4.1.2011.5.25.40.15.1.2.1.2
        - '0'
        - '{#RADIUSVRF}'
        - 1.3.6.1.4.1.2011.5.25.40.15.1.2.1.3
        - '0'
        - '{#RADIUSIP}'
        - 1.3.6.1.4.1.2011.5.25.40.15.1.2.1.4
        - '0'
        - '{#RADIUSPORT}'
        - 1.3.6.1.4.1.2011.5.25.40.15.1.2.1.5
        - '0'
      - type: JAVASCRIPT
        parameters:
        - "var rows = JSON.parse(value);\nfor (var i = 0; i < rows.length; i++) {\n    var idx = String(rows[i][\"{#SNMPINDEX}\"] || \"\").split('.');\n    var n = parseInt(idx[0], 10);\n    if (!isNaN(n) && idx.length >= n + 3) {\n        var s = \"\";\n        for (var j = 1; j <= n; j++) s += String.fromCharCode(parseInt(idx[j], 10));\n        rows[i][\"{#RADIUSGROUP}\"] = s;\n    } else {\n        rows[i][\"{#RADIUSGROUP}\"] = \"unknown\";\n    }\n    var t = String(rows[i][\"{#RADIUSTYPE}\"] || \"\");\n    rows[i][\"{#RADIUSTYPENAME}\"] = (t === \"1\") ? \"auth\" : (t === \"2\") ? \"acct\" : \"type-\" + t;\n}\nreturn JSON.stringify(rows);"
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      item_prototypes:
      - uuid: 64da439b3be54552be66eed9abf68fd1
        name: 'BNG RADIUS [{#RADIUSGROUP}] {#RADIUSTYPENAME} {#RADIUSIP}:{#RADIUSPORT} [{#RADIUSVRF}]: Responses total'
        type: DEPENDENT
        key: huawei.ne8k.bng.radius.responses[{#SNMPINDEX}]
        master_item:
          key: huawei.ne8k.bng.radius.walk
        history: 7d
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.5.25.40.15.1.2.1.12.{#SNMPINDEX}
          - '0'
        trends: 30d
        tags:
        - tag: component
          value: radius
        - tag: scope
          value: bng
        - tag: radius_group
          value: '{#RADIUSGROUP}'
        - tag: radius_type
          value: '{#RADIUSTYPENAME}'
