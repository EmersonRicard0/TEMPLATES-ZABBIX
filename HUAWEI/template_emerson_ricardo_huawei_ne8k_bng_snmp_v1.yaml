  - uuid: f31db8dbf83042099356d8222e761b96
    template: Template emerson.ricardo Huawei NE8K BNG SNMP
    name: Template emerson.ricardo Huawei NE8K BNG SNMP
    description: 'Template BNG para Huawei NetEngine 8000/VRP via SNMP, validado em NE8K M8 V800R024C00SPC500.


      Escopo desta versão:

      - assinantes globais PPPoE/IPv4/IPv6/dual-stack;

      - estatísticas PPP de conexão/falha como taxa;

      - discovery de domains AAA;

      - discovery de pools IPv4 e uso/capacidade;

      - discovery de interfaces BAS;

      - discovery de usuários por VLAN;

      - discovery de servidores RADIUS e respostas.


      A community e o endereço SNMP não ficam no template: use a interface SNMP do host.

      O status operacional RADIUS hwRadiusServerStatus (.22) não é exposto pela release validada; traps RADIUS e contadores PADI/PADO/PADR/PADS ficam para revisão futura.

      '
    vendor:
      name: Emerson.Ricardo
      version: 7.4-1
    groups:
    - name: Templates/Network devices
