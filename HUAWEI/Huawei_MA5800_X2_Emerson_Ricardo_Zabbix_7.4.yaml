    - uuid: eb35403fbe7746ee9d132717ab395241
      name: 'Huawei MA5800: ONT discovery'
      type: DEPENDENT
      key: huawei.ma5800.ont.discovery
      master_item:
        key: huawei.ma5800.ont.inventory.walk
      description: Discovers ONTs, correlates the composite ifIndex.ONT-ID with IF-MIB ifName and converts Huawei serial numbers.
      item_prototypes:
      - uuid: feeb096ce5864a7683de3625896880ee
        name: 'ONT {#PON}/{#ONTID} {#ONTDESC}: Description'
        type: DEPENDENT
        key: huawei.ma5800.ont.description[{#SNMPINDEX}]
        value_type: CHAR
        master_item:
          key: huawei.ma5800.ont.inventory.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.6.128.1.1.2.43.1.9.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 12h
        tags:
