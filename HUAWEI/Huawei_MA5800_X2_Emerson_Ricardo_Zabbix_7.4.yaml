          value: ont
        - tag: pon
          value: '{#PON}'
        - tag: serial
          value: '{#SERIAL}'
      - uuid: b37b057912ef491dbcc1cd49b1c0fabf
        name: 'ONT {#PON}/{#ONTID} {#ONTDESC}: Serial'
        type: DEPENDENT
        key: huawei.ma5800.ont.serial[{#SNMPINDEX}]
        value_type: CHAR
        master_item:
          key: huawei.ma5800.ont.inventory.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.6.128.1.1.2.43.1.3.{#SNMPINDEX}
          - '0'
        - type: JAVASCRIPT
          parameters:
          - |-
            var s = String(value).trim();
            var bytes = s.split(/\s+/).filter(function (x) { return /^[0-9A-Fa-f]{2}$/.test(x); });
            if (bytes.length !== 8) {
                return s;
            }
            var vendor = '';
            for (var i = 0; i < 4; i++) {
                var c = parseInt(bytes[i], 16);
                vendor += (c >= 32 && c <= 126) ? String.fromCharCode(c) : bytes[i].toUpperCase();
            }
            return vendor + bytes.slice(4).join('').toUpperCase();
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        tags:
        - tag: component
          value: ont
        - tag: pon
          value: '{#PON}'
        - tag: serial
          value: '{#SERIAL}'
