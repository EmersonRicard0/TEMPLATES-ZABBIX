      - uuid: b8c2cdb6f3f14cc6833426ac10e2df7f
        name: 'ONT {#PON}/{#ONTID} {#ONTDESC}: Last up'
        type: DEPENDENT
        key: huawei.ma5800.ont.lastup[{#SNMPINDEX}]
        value_type: CHAR
        master_item:
          key: huawei.ma5800.ont.state.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.6.128.1.1.2.46.1.22.{#SNMPINDEX}
          - '0'
        - type: JAVASCRIPT
          parameters:
          - |-
            var s = String(value).trim();
            var bytes = s.split(/\s+/).filter(function (x) { return /^[0-9A-Fa-f]{2}$/.test(x); });
            if (bytes.length < 8) {
                return s;
            }
            var b = bytes.map(function (x) { return parseInt(x, 16); });
            var allzero = true;
            for (var i = 0; i < 8; i++) {
                if (b[i] !== 0) { allzero = false; break; }
            }
            if (allzero) {
                return 'never';
            }
            function p2(n) { return (n < 10 ? '0' : '') + n; }
            var year = b[0] * 256 + b[1];
            var out = year + '-' + p2(b[2]) + '-' + p2(b[3]) + ' ' +
                      p2(b[4]) + ':' + p2(b[5]) + ':' + p2(b[6]);
            if (bytes.length >= 11 && (b[8] === 0x2B || b[8] === 0x2D)) {
                out += ' ' + String.fromCharCode(b[8]) + p2(b[9]) + ':' + p2(b[10]);
            }
            return out;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: ont
        - tag: pon
          value: '{#PON}'
