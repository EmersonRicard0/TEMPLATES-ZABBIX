        recovery_expression: last(/Huawei MA5800-X2 Emerson.Ricardo/huawei.ma5800.ont.status[{#SNMPINDEX}])=1 or {$HUAWEI.ONT.DOWN.TRIGGER:"{#SERIAL}"}=0
