zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 63e17bbce5e2437f90f489523bf15325
    template: Huawei MA5800-X2 Emerson.Ricardo
    name: Huawei MA5800-X2 Emerson.Ricardo
    description: |
      Template SNMP para Huawei MA5800-X2, construído e validado a partir de uma MA5800-X2 real.

      Principais recursos:
      - Informações gerais da OLT e total de ONTs;
      - Descoberta de boards via HWMUSA-DEV-MIB com CPU, RAM, temperatura e estado;
      - Descoberta de interfaces GPON/Ethernet com Counter64, erros e descartes;
      - Descoberta de ONTs com correlação ifIndex -> nome da PON;
      - Serial, descrição, status, distância, last up/down e last down cause;
      - DDM óptico por SNMP get[] individual: temperatura, bias, TX, RX, tensão e RX visto pela OLT;
      - Tratamento dos sentinelas Huawei 2147483647 e -1.

      A community SNMP e o endereço IP NÃO ficam neste template; configure-os na interface SNMP do host.

      Revision 7.4-3: Todos os passos de preprocessing possuem o campo parameters, incluindo CHANGE_PER_SECOND.
      Revision 7.4-5: DDM óptico convertido para get[OID] individual, evitando o walk pesado da árvore óptica.
      Revision 7.4-7:
      - OIDs de get[], walk[], SNMP walk to JSON e SNMP walk value normalizados para o formato usado nos templates oficiais Zabbix 7.4 (sem ponto inicial);
      - ONT inventory reduzido de 1h para 15m para descobrir novas ONTs mais rapidamente;
      - valores -1 de status/down-cause são descartados antes de chegar a itens Numeric unsigned;
      - temperaturas usam FLOAT para aceitar valores negativos válidos;
      - triggers ópticas só avaliam ONTs ONLINE;
      - dependências ICMP/SNMP adicionadas para reduzir alertas duplicados;
      - item LEGACY de DDM permanece removido.
    vendor:
      name: Emerson.Ricardo
      version: 7.4-7
    groups:
    - name: Templates/Network devices
    items:
    - uuid: ea27538a540c4d52abd94b3e3a83b31a
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: health
      - tag: scope
        value: availability
      triggers:
      - uuid: aa2b635d2cf34ba49061d678dd30149e
        expression: max(/Huawei MA5800-X2 Emerson.Ricardo/icmpping,#3)=0
        name: 'Huawei MA5800-X2: Indisponível por ICMP'
        priority: HIGH
        description: As últimas três tentativas de ICMP falharam.
        tags:
        - tag: scope
          value: availability
    - uuid: 73b2a26e1e154b7583b7cc77ea72deea
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: e28a074026434825966381a2866fda07
        expression: min(/Huawei MA5800-X2 Emerson.Ricardo/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Huawei MA5800-X2 Emerson.Ricardo/icmppingloss,5m)<100
        name: 'Huawei MA5800-X2: Perda ICMP elevada'
        opdata: 'Perda: {ITEM.LASTVALUE1}'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        dependencies:
        - name: 'Huawei MA5800-X2: Indisponível por ICMP'
          expression: max(/Huawei MA5800-X2 Emerson.Ricardo/icmpping,#3)=0
    - uuid: 6aace584a7e04353be645cb792f2ed4e
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: a6d3d3073b3c4a57b10bbd3b36e62f44
        expression: avg(/Huawei MA5800-X2 Emerson.Ricardo/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}
        name: 'Huawei MA5800-X2: Latência ICMP elevada'
        opdata: 'RTT: {ITEM.LASTVALUE1}'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        dependencies:
        - name: 'Huawei MA5800-X2: Perda ICMP elevada'
          expression: min(/Huawei MA5800-X2 Emerson.Ricardo/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Huawei MA5800-X2 Emerson.Ricardo/icmppingloss,5m)<100
        - name: 'Huawei MA5800-X2: Indisponível por ICMP'
          expression: max(/Huawei MA5800-X2 Emerson.Ricardo/icmpping,#3)=0
    - uuid: 410e552821b0410fba2d98d250cd5120
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      valuemap:
        name: Zabbix host availability
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 0f7e38f40227402fad0a2a32e85475eb
        expression: max(/Huawei MA5800-X2 Emerson.Ricardo/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Huawei MA5800-X2: Coleta SNMP indisponível'
        priority: WARNING
        description: O Zabbix não está conseguindo coletar dados via SNMP.
        tags:
        - tag: scope
          value: availability
        dependencies:
        - name: 'Huawei MA5800-X2: Indisponível por ICMP'
          expression: max(/Huawei MA5800-X2 Emerson.Ricardo/icmpping,#3)=0
    - uuid: 55102d5e3c744a7e83c0b88c7f27e626
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: huawei.ma5800.system.descr
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 27c19de4020b49cc80f706e05a7f546f
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: huawei.ma5800.system.objectid
      delay: 1h
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 29c3b91ef37341c1aaa87a7a09b49d91
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: huawei.ma5800.system.name
      delay: 15m
      value_type: CHAR
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 2db3c90d45ac4cdf9f3c4c9dac4cd5d8
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: huawei.ma5800.system.uptime
      delay: 1m
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 833b60174efb45b98cbca3d990a1b27c
      name: 'ONTs configured: Total'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2011.6.145.1.1.4.40.0]
      key: huawei.ma5800.ont.total
      delay: 5m
      tags:
      - tag: component
        value: ont
    - uuid: 243a784f34c043769dd78cd21299ebca
      name: 'SNMP walk: Boards'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.2011.2.6.7.1.1.2.1.5,1.3.6.1.4.1.2011.2.6.7.1.1.2.1.6,1.3.6.1.4.1.2011.2.6.7.1.1.2.1.7,1.3.6.1.4.1.2011.2.6.7.1.1.2.1.8,1.3.6.1.4.1.2011.2.6.7.1.1.2.1.10,1.3.6.1.4.1.2011.2.6.7.1.1.2.1.18,1.3.6.1.4.1.2011.2.6.7.1.1.2.1.19,1.3.6.1.4.1.2011.2.6.7.1.1.2.1.20]
      key: huawei.ma5800.board.walk
      delay: 2m
      history: '0'
      value_type: TEXT
      description: Master SNMP walk for MA5800 boards (HWMUSA-DEV-MIB).
      tags:
      - tag: component
        value: raw
    - uuid: 65f3a97d6544480eacbefd7bcbf7a944
      name: 'SNMP walk: Physical interfaces'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18,1.3.6.1.2.1.2.2.1.7,1.3.6.1.2.1.2.2.1.8,1.3.6.1.2.1.31.1.1.1.15,1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.2.2.1.13,1.3.6.1.2.1.2.2.1.14,1.3.6.1.2.1.2.2.1.19,1.3.6.1.2.1.2.2.1.20]
      key: huawei.ma5800.interface.walk
      delay: 1m
      history: '0'
      value_type: TEXT
      description: Master SNMP walk for GPON and Ethernet interfaces.
      tags:
      - tag: component
        value: raw
    - uuid: 19a5a78861204c6d85f5df3a78064453
      name: 'SNMP walk: ONT inventory'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.2011.6.128.1.1.2.43.1.3,1.3.6.1.4.1.2011.6.128.1.1.2.43.1.9,1.3.6.1.2.1.31.1.1.1.1]
      key: huawei.ma5800.ont.inventory.walk
      delay: 15m
      history: '0'
      value_type: TEXT
      description: Master walk for ONT serial/description and IF-MIB ifName correlation.
      tags:
      - tag: component
        value: raw
    - uuid: 6c64b452164b4b028e04225c78ebb452
      name: 'SNMP walk: ONT status'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.2011.6.128.1.1.2.46.1.15,1.3.6.1.4.1.2011.6.128.1.1.2.46.1.20,1.3.6.1.4.1.2011.6.128.1.1.2.46.1.22,1.3.6.1.4.1.2011.6.128.1.1.2.46.1.23,1.3.6.1.4.1.2011.6.128.1.1.2.46.1.24]
      key: huawei.ma5800.ont.state.walk
      delay: 1m
      history: '0'
      value_type: TEXT
      description: Master walk for ONT run status, distance and last state-change information.
      tags:
      - tag: component
        value: raw
    - uuid: 1342fce4cd384c618f805d15ee85897e
      name: ONTs online
      type: DEPENDENT
      key: huawei.ma5800.ont.online.count
      master_item:
        key: huawei.ma5800.ont.state.walk
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          var re = /^\.?1\.3\.6\.1\.4\.1\.2011\.6\.128\.1\.1\.2\.46\.1\.15\.\d+\.\d+\s*=\s*(?:INTEGER:\s*)?(-?\d+)/gm;
          var m, n = 0;
          while ((m = re.exec(String(value))) !== null) {
              if (Number(m[1]) === 1) n++;
          }
          return n;
      tags:
      - tag: component
        value: ont
    - uuid: e3aef266121f40c6b3a67287b047da80
      name: ONTs offline
      type: DEPENDENT
      key: huawei.ma5800.ont.offline.count
      master_item:
        key: huawei.ma5800.ont.state.walk
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |-
          var re = /^\.?1\.3\.6\.1\.4\.1\.2011\.6\.128\.1\.1\.2\.46\.1\.15\.\d+\.\d+\s*=\s*(?:INTEGER:\s*)?(-?\d+)/gm;
          var m, n = 0;
          while ((m = re.exec(String(value))) !== null) {
              if (Number(m[1]) === 2) n++;
          }
          return n;
      tags:
      - tag: component
        value: ont
    discovery_rules:
    - uuid: 0b05d82174ca4592920b91abc8d87482
      name: 'Huawei MA5800: Board discovery'
      type: DEPENDENT
      key: huawei.ma5800.board.discovery
      master_item:
        key: huawei.ma5800.board.walk
      description: Discovers MA5800 boards using HWMUSA-DEV-MIB. Index format is frame.slot.
      item_prototypes:
      - uuid: f50d6ebd296a42f59adb990acfa9def3
        name: 'Board {#SNMPINDEX}: Model'
        type: DEPENDENT
        key: huawei.ma5800.board.model[{#SNMPINDEX}]
        value_type: CHAR
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.7.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        tags:
        - tag: component
          value: hardware
        - tag: board
          value: '{#BOARD}'
      - uuid: aeb5a454ce384b4fa12ba81d3643f857
        name: 'Board {#SNMPINDEX} {#BOARD}: Online state'
        type: DEPENDENT
        key: huawei.ma5800.board.status[{#SNMPINDEX}]
        valuemap:
          name: Huawei MA5800 board online state
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.8.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        tags:
        - tag: component
          value: hardware
        - tag: board
          value: '{#BOARD}'
      - uuid: 9ca77642562d426292ff09e6b27c87d3
        name: 'Board {#SNMPINDEX} {#BOARD}: CPU utilization'
        type: DEPENDENT
        key: huawei.ma5800.board.cpu[{#SNMPINDEX}]
        units: '%'
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.5.{#SNMPINDEX}
          - '0'
        - type: NOT_MATCHES_REGEX
          parameters:
          - ^-1$
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: cpu
        - tag: board
          value: '{#BOARD}'
      - uuid: c2c2c0d0d900491ebc7d36f1f23f7027
        name: 'Board {#SNMPINDEX} {#BOARD}: Memory utilization'
        type: DEPENDENT
        key: huawei.ma5800.board.memory[{#SNMPINDEX}]
        units: '%'
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.6.{#SNMPINDEX}
          - '0'
        - type: NOT_MATCHES_REGEX
          parameters:
          - ^-1$
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: memory
        - tag: board
          value: '{#BOARD}'
      - uuid: 82f8f652ba814bac8549882c6f14596a
        name: 'Board {#SNMPINDEX} {#BOARD}: Temperature'
        type: DEPENDENT
        key: huawei.ma5800.board.temperature[{#SNMPINDEX}]
        units: °C
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.10.{#SNMPINDEX}
          - '0'
        - type: NOT_MATCHES_REGEX
          parameters:
          - ^(?:2147483647|-1)$
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: temperature
        - tag: board
          value: '{#BOARD}'
        value_type: FLOAT
      - uuid: 1f35f350cdce4f5dbe3d93a1f16caf9a
        name: 'Board {#SNMPINDEX} {#BOARD}: RAM total'
        type: DEPENDENT
        key: huawei.ma5800.board.ram.total[{#SNMPINDEX}]
        units: B
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.18.{#SNMPINDEX}
          - '0'
        - type: MATCHES_REGEX
          parameters:
          - ^[1-9][0-9]*$
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: memory
        - tag: board
          value: '{#BOARD}'
      - uuid: 9cd8e92474d94abba9bb40d5b74306d5
        name: 'Board {#SNMPINDEX} {#BOARD}: RAM used'
        type: DEPENDENT
        key: huawei.ma5800.board.ram.used[{#SNMPINDEX}]
        units: B
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.19.{#SNMPINDEX}
          - '0'
        - type: MATCHES_REGEX
          parameters:
          - ^[1-9][0-9]*$
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: memory
        - tag: board
          value: '{#BOARD}'
      - uuid: b5c88d86a46c46078ac6df4bed274594
        name: 'Board {#SNMPINDEX} {#BOARD}: RAM free'
        type: DEPENDENT
        key: huawei.ma5800.board.ram.free[{#SNMPINDEX}]
        units: B
        master_item:
          key: huawei.ma5800.board.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.20.{#SNMPINDEX}
          - '0'
        - type: MATCHES_REGEX
          parameters:
          - ^[1-9][0-9]*$
          error_handler: DISCARD_VALUE
        tags:
        - tag: component
          value: memory
        - tag: board
          value: '{#BOARD}'
      graph_prototypes:
      - uuid: 1cb5b59be9e84032afbd4f836059a929
        name: 'Board {#SNMPINDEX} {#BOARD}: CPU and memory'
        graph_items:
        - color: 199C0D
          item:
            host: Huawei MA5800-X2 Emerson.Ricardo
            key: huawei.ma5800.board.cpu[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: Huawei MA5800-X2 Emerson.Ricardo
            key: huawei.ma5800.board.memory[{#SNMPINDEX}]
      - uuid: e1eda1f94ac24bbb857f78e42853236e
        name: 'Board {#SNMPINDEX} {#BOARD}: Temperature'
        graph_items:
        - color: 199C0D
          item:
            host: Huawei MA5800-X2 Emerson.Ricardo
            key: huawei.ma5800.board.temperature[{#SNMPINDEX}]
      preprocessing:
      - type: SNMP_WALK_TO_JSON
        parameters:
        - '{#BOARD}'
        - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.7
        - '0'
        - '{#BOARDSTATUS}'
        - 1.3.6.1.4.1.2011.2.6.7.1.1.2.1.8
        - '0'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      trigger_prototypes:
      - uuid: 70fe6ecfa9ea47fc93603ffa838649b7
        expression: '{$HUAWEI.BOARD.STATUS.TRIGGER:"{#SNMPINDEX}"}=1 and last(/Huawei MA5800-X2 Emerson.Ricardo/huawei.ma5800.board.status[{#SNMPINDEX}])<>1'
        name: 'Huawei MA5800-X2: Board {#SNMPINDEX} {#BOARD} não está online'
        opdata: 'Estado: {ITEM.LASTVALUE1}'
        priority: HIGH
        tags:
        - tag: scope
          value: availability
      - uuid: 0c5e269a34e14e1e82653b6a1e90db27
        expression: avg(/Huawei MA5800-X2 Emerson.Ricardo/huawei.ma5800.board.cpu[{#SNMPINDEX}],5m)>{$HUAWEI.BOARD.CPU.WARN}
        name: 'Huawei MA5800-X2: CPU elevada na board {#SNMPINDEX} {#BOARD}'
        opdata: 'CPU: {ITEM.LASTVALUE1}'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
      - uuid: 1d891fe3629f42a49d5164686fecaddf
        expression: avg(/Huawei MA5800-X2 Emerson.Ricardo/huawei.ma5800.board.memory[{#SNMPINDEX}],5m)>{$HUAWEI.BOARD.MEM.WARN}
        name: 'Huawei MA5800-X2: Memória elevada na board {#SNMPINDEX} {#BOARD}'
        opdata: 'Memória: {ITEM.LASTVALUE1}'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
      - uuid: 599a7ed35fc54eec83e1242370a8b7cf
        expression: avg(/Huawei MA5800-X2 Emerson.Ricardo/huawei.ma5800.board.temperature[{#SNMPINDEX}],5m)>{$HUAWEI.BOARD.TEMP.WARN}
        name: 'Huawei MA5800-X2: Temperatura elevada na board {#SNMPINDEX} {#BOARD}'
        opdata: 'Temperatura: {ITEM.LASTVALUE1}'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
    - uuid: 10ec64087ce0436995e3a74bb5804145
      name: 'Huawei MA5800: Physical interface discovery'
      type: DEPENDENT
      key: huawei.ma5800.if.discovery
      master_item:
        key: huawei.ma5800.interface.walk
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: ^(GPON |ethernet)
      description: Discovers GPON and physical Ethernet interfaces. VLAN/loopback interfaces are intentionally excluded.
      item_prototypes:
      - uuid: 1cf7f95893bb463eb0b3a685fa91ae40
        name: 'Interface {#IFNAME}: Alias'
        type: DEPENDENT
        key: huawei.ma5800.if.alias[{#SNMPINDEX}]
        value_type: CHAR
        master_item:
          key: huawei.ma5800.interface.walk
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.18.{#SNMPINDEX}
          - '0'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 12h
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: b382a804b07f46e0bc03eb30c626ae81
        name: 'Interface {#IFNAME}: Admin status'
        type: DEPENDENT
        key: huawei.ma5800.if.admin[{#SNMPINDEX}]
        valuemap:
          name: IF-MIB::ifAdminStatus
        master_item:
          key: huawei.ma5800.interface.walk
