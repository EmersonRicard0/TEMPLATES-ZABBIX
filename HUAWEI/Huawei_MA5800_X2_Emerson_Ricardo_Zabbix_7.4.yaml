              v = String(v).trim();
              if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') {
                  v = v.substring(1, v.length - 1);
                  v = v.replace(/\\"/g, '"').replace(/\\\\/g, '\\');
              }
              return v;
          }

          function serialFromHex(v) {
              var bytes = String(v).trim().split(/\s+/).filter(function (x) {
                  return /^[0-9A-Fa-f]{2}$/.test(x);
              });
              if (bytes.length !== 8) {
                  return cleanString(v);
              }
              var vendor = '';
              for (var i = 0; i < 4; i++) {
                  var c = parseInt(bytes[i], 16);
                  vendor += (c >= 32 && c <= 126) ? String.fromCharCode(c) : bytes[i].toUpperCase();
              }
              return vendor + bytes.slice(4).join('').toUpperCase();
          }

          String(value).split('\n').forEach(function (line) {
              var m = line.match(/^(\.?\d+(?:\.\d+)*)\s*=\s*(?:([A-Za-z0-9-]+):\s*)?(.*)$/);
              if (!m) return;

              var oid = m[1];
              if (oid.charAt(0) !== '.') oid = '.' + oid;

              var type = m[2] || '';
              var raw = m[3] || '';

              if (oid.indexOf(P_IFNAME) === 0) {
                  ifNames[oid.substring(P_IFNAME.length)] = cleanString(raw);
              }
              else if (oid.indexOf(P_DESC) === 0) {
                  descs[oid.substring(P_DESC.length)] = cleanString(raw);
              }
              else if (oid.indexOf(P_SERIAL) === 0) {
                  serials[oid.substring(P_SERIAL.length)] =
                      (type === 'Hex-STRING') ? serialFromHex(raw) : cleanString(raw);
              }
          });

          var keys = {};
          Object.keys(descs).forEach(function (k) { keys[k] = true; });
          Object.keys(serials).forEach(function (k) { keys[k] = true; });

          var out = [];
          Object.keys(keys).sort(function (a, b) {
              var aa = a.split('.').map(Number);
              var bb = b.split('.').map(Number);
              for (var i = 0; i < Math.max(aa.length, bb.length); i++) {
                  var av = aa[i] || 0;
                  var bv = bb[i] || 0;
                  if (av !== bv) return av - bv;
              }
              return 0;
          }).forEach(function (idx) {
              var p = idx.split('.');
              if (p.length < 2) return;

              var ifIndex = p[0];
              var ontId = p.slice(1).join('.');
              var pon = ifNames[ifIndex] || ('ifIndex ' + ifIndex);

              out.push({
                  '{#SNMPINDEX}': idx,
                  '{#IFINDEX}': ifIndex,
                  '{#ONTID}': ontId,
                  '{#PON}': pon,
                  '{#ONTDESC}': descs[idx] || '',
                  '{#SERIAL}': serials[idx] || ''
              });
          });

          return JSON.stringify(out);
